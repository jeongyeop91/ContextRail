name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-22:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic tests
        run: npm test
      - name: Validate repository contracts
        run: node bin/contextrail.mjs check
      - name: Smoke packed artifact
        run: node --test test/release.test.mjs
      - name: Inspect package allowlist
        run: npm pack --dry-run --json
      - name: Check whitespace
        run: git diff --check
